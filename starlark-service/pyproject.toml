[project]
name = "minecraft-starlark-service"
version = "0.1.0"
description = "Optional Starlark build service for minecraft-mcp-api"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "python-dotenv>=1.0.0",
    "starlark-to-nbt",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.4",
]

[tool.uv.sources]
starlark-to-nbt = { path = "starlark-to-nbt" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["starlark_service"]

[project.scripts]
starlark-service = "starlark_service.main:main"

[tool.pytest.ini_options]
testpaths = ["test_app.py", "test_cache.py", "test_sandbox.py"]
