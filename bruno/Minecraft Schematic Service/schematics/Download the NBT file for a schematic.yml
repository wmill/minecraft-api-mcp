info:
  name: Download the NBT file for a schematic
  type: http
  seq: 4
  tags:
    - schematics

http:
  method: GET
  url: "{{baseUrl}}/schematics/:schematic_id/nbt"
  params:
    - name: schematic_id
      value: "12345"
      type: path
      description: Numeric schematic identifier
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: NBT binary file
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/nbt"
      method: GET
      params:
        - name: schematic_id
          value: "12345"
          type: path
          description: Numeric schematic identifier
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/octet-stream
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid schematic_id (must be numeric)
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/nbt"
      method: GET
      params:
        - name: schematic_id
          value: "12345"
          type: path
          description: Numeric schematic identifier
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 404 Response
    description: NBT file not found
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/nbt"
      method: GET
      params:
        - name: schematic_id
          value: "12345"
          type: path
          description: Numeric schematic identifier
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
  - name: 503 Response
    description: Catalog data unavailable
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/nbt"
      method: GET
      params:
        - name: schematic_id
          value: "12345"
          type: path
          description: Numeric schematic identifier
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
