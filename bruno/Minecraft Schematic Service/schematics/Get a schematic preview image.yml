info:
  name: Get a schematic preview image
  type: http
  seq: 5
  tags:
    - schematics

http:
  method: GET
  url: "{{baseUrl}}/schematics/:schematic_id/images/:view"
  params:
    - name: schematic_id
      value: "156"
      type: path
      description: Numeric schematic identifier
    - name: view
      value: "sheet"
      type: path
      description: sheet, iso, top, north, south, east or west
    - name: max_px
      value: "768"
      type: query
      description: Longest side in px (64-1024); per tile for sheet (default 256)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: PNG image
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/images/:view"
      method: GET
      params:
        - name: schematic_id
          value: "156"
          type: path
          description: Numeric schematic identifier
        - name: view
          value: "sheet"
          type: path
          description: sheet, iso, top, north, south, east or west
        - name: max_px
          value: "768"
          type: query
          description: Longest side in px (64-1024); per tile for sheet (default 256)
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: image/png
      body:
        type: text
        data: ""
  - name: 404 Response
    description: Not a catalogued, placeable schematic
    request:
      url: "{{baseUrl}}/schematics/:schematic_id/images/:view"
      method: GET
      params:
        - name: schematic_id
          value: "156"
          type: path
          description: Numeric schematic identifier
        - name: view
          value: "sheet"
          type: path
          description: sheet, iso, top, north, south, east or west
        - name: max_px
          value: "768"
          type: query
          description: Longest side in px (64-1024); per tile for sheet (default 256)
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": "schematic not found"
          }
