info:
  name: Health check
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/health"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Service health status
    request:
      url: "{{baseUrl}}/health"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "ok": false,
            "catalog_exists": false,
            "nbt_dir_exists": false,
            "elasticsearch": {
              "available": false,
              "elasticsearch": {},
              "error": ""
            }
          }
