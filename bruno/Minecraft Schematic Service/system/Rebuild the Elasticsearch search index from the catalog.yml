info:
  name: Rebuild the Elasticsearch search index from the catalog
  type: http
  seq: 2
  tags:
    - system

http:
  method: POST
  url: "{{baseUrl}}/index/rebuild"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Index rebuilt successfully
    request:
      url: "{{baseUrl}}/index/rebuild"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "indexed": 0
          }
  - name: 503 Response
    description: Elasticsearch unavailable
    request:
      url: "{{baseUrl}}/index/rebuild"
      method: POST
    response:
      status: 503
      statusText: Service Unavailable
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "detail": ""
          }
