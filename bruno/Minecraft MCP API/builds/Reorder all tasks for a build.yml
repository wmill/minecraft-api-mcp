info:
  name: Reorder all tasks for a build
  type: http
  seq: 6
  tags:
    - builds

http:
  method: PUT
  url: "{{baseUrl}}/api/builds/:id/tasks"
  params:
    - name: id
      value: ""
      type: path
      description: Build UUID
  body:
    type: json
    data: |-
      {
        "tasks": [
          {
            "id": "",
            "build_id": "",
            "task_order": 0,
            "task_type": "BLOCK_SET",
            "status": "QUEUED",
            "task_data": {},
            "description": "",
            "executed_at": "",
            "error_message": ""
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

