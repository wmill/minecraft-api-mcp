info:
  name: Render isometric build preview as PNG
  type: http
  seq: 11
  tags:
    - builds

http:
  method: GET
  url: "{{baseUrl}}/api/builds/:id/preview"
  params:
    - name: id
      value: ""
      type: path
      description: Build UUID
    - name: iso_scale
      value: "6"
      type: query
    - name: terrain_margin
      value: "0"
      type: query
    - name: view_direction
      value: south
      type: query
    - name: view_direction
      value: west
      type: query
      disabled: true
    - name: view_direction
      value: north
      type: query
      disabled: true
    - name: view_direction
      value: east
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: PNG image
    request:
      url: "{{baseUrl}}/api/builds/:id/preview"
      method: GET
