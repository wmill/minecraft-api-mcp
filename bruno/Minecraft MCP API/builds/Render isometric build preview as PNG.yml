          type: query
        - name: view_direction
          value: west
          type: query
          disabled: true
        - name: view_direction
          value: north
          type: query
          disabled: true
        - name: view_direction
          value: east
          type: query
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: image/png
      body:
        type: text
        data: ""
