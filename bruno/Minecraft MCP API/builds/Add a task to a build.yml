info:
  name: Add a task to a build
  type: http
  seq: 5
  tags:
    - builds

http:
  method: POST
  url: "{{baseUrl}}/api/builds/:id/tasks"
  params:
    - name: id
      value: ""
      type: path
      description: Build UUID
  body:
    type: json
    data: |-
      {
        "task_type": "BLOCK_SET",
        "task_data": {},
        "description": "",
        "task_order": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 201 Response
    description: Task added
    request:
      url: "{{baseUrl}}/api/builds/:id/tasks"
      method: POST
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
      body:
        type: json
        data: |-
          {
            "task_type": "BLOCK_SET",
            "task_data": {},
            "description": "",
            "task_order": 0
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
