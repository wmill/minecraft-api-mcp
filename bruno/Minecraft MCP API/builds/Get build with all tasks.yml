info:
  name: Get build with all tasks
  type: http
  seq: 3
  tags:
    - builds

http:
  method: GET
  url: "{{baseUrl}}/api/builds/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Build UUID
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Build details
    request:
      url: "{{baseUrl}}/api/builds/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "build": {
              "id": "",
              "name": "",
              "description": "",
              "world": "minecraft:overworld",
              "status": "CREATED",
              "created_at": "",
              "completed_at": ""
            },
            "tasks": [
              {
                "id": "",
                "build_id": "",
                "task_order": 0,
                "task_type": "BLOCK_SET",
                "status": "QUEUED",
                "task_data": {},
                "description": "",
                "executed_at": "",
                "error_message": ""
              }
            ]
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/builds/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 404 Response
    description: Resource not found
    request:
      url: "{{baseUrl}}/api/builds/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/builds/:id"
      method: GET
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
