info:
  name: Update a task's data or description
  type: http
  seq: 8
  tags:
    - builds

http:
  method: PATCH
  url: "{{baseUrl}}/api/builds/:id/tasks/:taskId"
  params:
    - name: id
      value: ""
      type: path
      description: Build UUID
    - name: taskId
      value: ""
      type: path
      description: Task UUID
  body:
    type: json
    data: |-
      {
        "task_data": {},
        "description": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Task updated
    request:
      url: "{{baseUrl}}/api/builds/:id/tasks/:taskId"
      method: PATCH
      params:
        - name: id
          value: ""
          type: path
          description: Build UUID
        - name: taskId
          value: ""
          type: path
          description: Task UUID
      body:
        type: json
        data: |-
          {
            "task_data": {},
            "description": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "task": {
              "id": "",
              "build_id": "",
              "task_order": 0,
              "task_type": "BLOCK_SET",
              "status": "QUEUED",
              "task_data": {},
              "description": "",
              "executed_at": "",
              "error_message": ""
