info:
  name: Find builds overlapping a bounding box
  type: http
  seq: 2
  tags:
    - builds

http:
  method: POST
  url: "{{baseUrl}}/api/builds/query-location"
  body:
    type: json
    data: |-
      {
        "world": "minecraft:overworld",
        "min_x": 0,
        "min_y": 0,
        "min_z": 0,
        "max_x": 0,
        "max_y": 0,
        "max_z": 0,
        "include_in_progress": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Matching builds
    request:
      url: "{{baseUrl}}/api/builds/query-location"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "min_x": 0,
            "min_y": 0,
            "min_z": 0,
            "max_x": 0,
            "max_y": 0,
            "max_z": 0,
            "include_in_progress": false
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "query_area": {
              "min_x": 0,
              "min_y": 0,
              "min_z": 0,
              "max_x": 0,
              "max_y": 0,
              "max_z": 0,
              "world": ""
            },
            "build_count": 0,
            "total_task_count": 0,
            "builds": [
              {}
            ]
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/builds/query-location"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "min_x": 0,
            "min_y": 0,
            "min_z": 0,
            "max_x": 0,
            "max_y": 0,
            "max_z": 0,
            "include_in_progress": false
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/builds/query-location"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "min_x": 0,
            "min_y": 0,
            "min_z": 0,
            "max_x": 0,
            "max_y": 0,
            "max_z": 0,
            "include_in_progress": false
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
