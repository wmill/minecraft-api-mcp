            "error": ""
          }
  - name: 404 Response
    description: Resource not found
    request:
      url: "{{baseUrl}}/api/rail-plans/:jobId"
      method: GET
      params:
        - name: jobId
          value: ""
          type: path
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/rail-plans/:jobId"
      method: GET
      params:
        - name: jobId
          value: ""
          type: path
