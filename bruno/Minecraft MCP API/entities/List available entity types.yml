info:
  name: List available entity types
  type: http
  seq: 1
  tags:
    - entities

http:
  method: GET
  url: "{{baseUrl}}/api/world/entities"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Array of entity types
    request:
      url: "{{baseUrl}}/api/world/entities"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "minecraft:zombie",
              "display_name": ""
            }
          ]
