info:
  name: Release an area lock
  type: http
  seq: 4
  tags:
    - area-locks

http:
  method: DELETE
  url: "{{baseUrl}}/api/area-locks/:lock_id"
  params:
    - name: lock_id
      value: ""
      type: path
      description: Lock id returned when the lock was acquired
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Lock released
    request:
      url: "{{baseUrl}}/api/area-locks/:lock_id"
      method: DELETE
      params:
        - name: lock_id
          value: ""
          type: path
          description: Lock id returned when the lock was acquired
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true
          }
