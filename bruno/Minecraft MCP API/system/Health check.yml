info:
  name: Health check
  type: http
  seq: 1
  tags:
    - system

http:
  method: GET
  url: "{{baseUrl}}/api/test"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Server is running
    request:
      url: "{{baseUrl}}/api/test"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: text/plain
      body:
        type: text
        data: Server is running
