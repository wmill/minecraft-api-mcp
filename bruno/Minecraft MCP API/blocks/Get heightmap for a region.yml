info:
  name: Get heightmap for a region
  type: http
  seq: 5
  tags:
    - blocks

http:
  method: POST
  url: "{{baseUrl}}/api/world/blocks/heightmap"
  body:
    type: json
    data: |-
      {
        "world": "minecraft:overworld",
        "x1": 0,
        "z1": 0,
        "x2": 0,
        "z2": 0,
        "heightmap_type": "WORLD_SURFACE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Heightmap data
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "x1": 0,
            "z1": 0,
            "x2": 0,
            "z2": 0,
            "heightmap_type": "WORLD_SURFACE"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": false,
            "world": "",
            "area_bounds": {},
            "size": {
              "width": 0,
              "height": 0
            },
            "heightmap_type": "",
            "height_range": {
              "min": 0,
              "max": 0
            },
            "heights": [
              []
            ]
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "x1": 0,
            "z1": 0,
            "x2": 0,
            "z2": 0,
            "heightmap_type": "WORLD_SURFACE"
          }
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap"
      method: POST
      body:
        type: json
        data: |-
          {
            "world": "minecraft:overworld",
            "x1": 0,
            "z1": 0,
            "x2": 0,
            "z2": 0,
            "heightmap_type": "WORLD_SURFACE"
          }
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
