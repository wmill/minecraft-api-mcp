info:
  name: Render isometric heightmap preview as PNG
  type: http
  seq: 6
  tags:
    - blocks

http:
  method: POST
  url: "{{baseUrl}}/api/world/blocks/heightmap/preview"
  body:
    type: json
    data: "{}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: PNG image
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: image/png
      body:
        type: text
        data: ""
  - name: 204 Response
    description: No blocks in region
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 204
      statusText: No Content
      body:
        type: text
        data: ""
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 400
      statusText: Bad Request
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
  - name: 500 Response
    description: Internal server error
    request:
      url: "{{baseUrl}}/api/world/blocks/heightmap/preview"
      method: POST
      body:
        type: json
        data: "{}"
    response:
      status: 500
      statusText: Internal Server Error
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "error": ""
          }
