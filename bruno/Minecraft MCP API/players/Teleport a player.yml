info:
  name: Teleport a player
  type: http
  seq: 2
  tags:
    - players

http:
  method: POST
  url: "{{baseUrl}}/api/players/teleport"
  body:
    type: json
    data: |-
      {
        "player_name": "",
        "x": 0,
        "y": 0,
        "z": 0,
        "dimension": "minecraft:overworld",
        "yaw": 0,
        "pitch": 0
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: Teleport successful
    request:
      url: "{{baseUrl}}/api/players/teleport"
      method: POST
      body:
        type: json
        data: |-
          {
            "player_name": "",
            "x": 0,
            "y": 0,
            "z": 0,
            "dimension": "minecraft:overworld",
            "yaw": 0,
            "pitch": 0
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true,
            "status": "success",
            "message": "",
            "player_name": "",
            "x": 0,
            "y": 0,
            "z": 0,
            "dimension": "",
            "yaw": 0,
            "pitch": 0
          }
  - name: 400 Response
    description: Invalid request
    request:
      url: "{{baseUrl}}/api/players/teleport"
      method: POST
      body:
        type: json
        data: |-
          {
            "player_name": "",
