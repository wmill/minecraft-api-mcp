info:
  name: Get the component catalog
  type: http
  seq: 1
  tags:
    - reference

http:
  method: GET
  url: "{{baseUrl}}/docs/catalog"
  params:
    - name: topic
      value: "quickstart"
      type: query
      description: quickstart, full, dsl, composition, errors, library, components, math, or a lib module name
    - name: component
      value: "GableRoof"
      type: query
      description: One component's reference (overrides topic)
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
