<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Minecraft Docker Compose architecture</title>
  <desc id="desc">HTTPS clients connect through nginx to MCP or the Minecraft REST API. MCP calls Minecraft, which persists build tasks in PostgreSQL. Players connect directly to Minecraft. Optional Starlark and schematic services provide artifacts to MCP; schematic search uses Elasticsearch. Certbot shares certificate and challenge volumes with nginx.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52657c"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #23354b; }
      .heading { font-size: 27px; font-weight: 700; }
      .name { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #52657c; }
      .label { font-size: 14px; fill: #40546c; paint-order: stroke; stroke: #f8fafc; stroke-width: 6px; stroke-linejoin: round; }
      .node { fill: white; stroke: #b4c5d8; stroke-width: 1.5; }
      .optional { fill: #f3f0ff; stroke: #9b89ce; stroke-width: 1.5; }
      .edge { fill: none; stroke: #52657c; stroke-width: 2; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 5; }
    </style>
  </defs>
  <rect width="1200" height="980" rx="16" fill="#f8fafc"/>
  <text x="40" y="48" class="heading">Minecraft server stack</text>
  <text x="40" y="76" class="body">Docker Compose services · arrows point from caller to service</text>

  <rect x="40" y="180" width="1120" height="660" rx="20" fill="#edf3f9" stroke="#cedae7"/>
  <text x="60" y="207" class="small">COMPOSE DEFAULT NETWORK · service names resolve inside Docker</text>

  <rect x="75" y="105" width="230" height="48" rx="10" class="node"/>
  <text x="190" y="135" text-anchor="middle" class="body">MCP / REST clients</text>
  <rect x="820" y="105" width="280" height="48" rx="10" class="node"/>
  <text x="960" y="135" text-anchor="middle" class="body">Minecraft players</text>

  <path d="M190 153V245" class="edge"/>
  <text x="202" y="232" class="label">HTTPS :443</text>
  <path d="M960 153V245" class="edge"/>
  <text x="972" y="232" class="label">TCP :25565</text>

  <rect x="75" y="245" width="230" height="140" rx="12" class="node"/>
  <text x="95" y="277" class="name">nginx</text>
  <text x="95" y="303" class="body">TLS reverse proxy</text>
  <text x="95" y="329" class="small">:80 → HTTPS + ACME</text>
  <text x="95" y="351" class="small">REST routes use Basic Auth</text>
  <text x="95" y="372" class="small">image: minecraft-api-nginx</text>

  <rect x="450" y="245" width="260" height="140" rx="12" class="node"/>
  <text x="470" y="277" class="name">mcp</text>
  <text x="470" y="303" class="body">Python MCP server</text>
  <text x="470" y="329" class="small">Streamable HTTP · /mcp</text>
  <text x="470" y="351" class="small">Host also publishes :3737</text>
  <text x="470" y="372" class="small">image: minecraft-mcp</text>

  <rect x="820" y="245" width="280" height="140" rx="12" class="node"/>
  <text x="840" y="277" class="name">minecraft</text>
  <text x="840" y="303" class="body">Fabric + Javalin REST API</text>
  <text x="840" y="329" class="small">Game :25565 · API :7070</text>
  <text x="840" y="351" class="small">World + snapshots: minecraft_data</text>
  <text x="840" y="372" class="small">image: minecraft-api</text>

  <path d="M305 290H450" class="edge"/>
  <text x="377" y="278" text-anchor="middle" class="label">/mcp · :3737</text>
  <path d="M710 315H820" class="edge"/>
  <text x="765" y="302" text-anchor="middle" class="label">HTTP :7070</text>
  <path d="M305 354H350V418H785V354H820" class="edge"/>
  <text x="565" y="411" text-anchor="middle" class="label">REST API · :7070 · api.veepl.ca</text>

  <rect x="820" y="470" width="280" height="120" rx="12" class="node"/>
  <text x="840" y="502" class="name">postgres</text>
  <text x="840" y="528" class="body">Build tasks and status</text>
  <text x="840" y="552" class="small">Volume: postgres_data</text>
  <text x="840" y="575" class="small">image: postgres:16-alpine</text>
  <path d="M960 385V470" class="edge"/>
  <text x="972" y="442" class="label">PostgreSQL :5432</text>

  <rect x="75" y="470" width="230" height="155" rx="12" class="node"/>
  <text x="95" y="502" class="name">certbot</text>
  <text x="95" y="528" class="body">Certificate renewal</text>
  <text x="95" y="554" class="small">Shared with nginx:</text>
  <text x="95" y="576" class="small">letsencrypt · certbot_www</text>
  <text x="95" y="607" class="small">image: certbot/certbot:latest</text>
  <path d="M190 470V385" fill="none" stroke="#52657c" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="202" y="448" class="label">shared files</text>

  <rect x="450" y="470" width="260" height="155" rx="12" class="optional"/>
  <text x="470" y="500" class="small">OPTIONAL · profile: starlark</text>
  <text x="470" y="529" class="name">starlark-service</text>
  <text x="470" y="555" class="body">Compile NBT + render previews</text>
  <text x="470" y="581" class="small">Mounts: starlark-service-data</text>
  <text x="470" y="602" class="small">and starlark-library (both rw)</text>
  <path d="M580 385V470" class="edge"/>
  <text x="592" y="449" class="label">HTTP :7090</text>

  <rect x="450" y="680" width="260" height="135" rx="12" class="optional"/>
  <text x="470" y="709" class="small">OPTIONAL · profile: schematics</text>
  <text x="470" y="738" class="name">schematic-service</text>
  <text x="470" y="764" class="body">Search catalog + serve NBT</text>
  <text x="470" y="790" class="small">Mount: schematic-service-data (ro)</text>
  <rect x="820" y="680" width="280" height="135" rx="12" class="optional"/>
  <text x="840" y="709" class="small">OPTIONAL · profile: schematics</text>
  <text x="840" y="738" class="name">elasticsearch</text>
  <text x="840" y="764" class="body">Search index · version 8.17.0</text>
  <text x="840" y="790" class="small">Volume: schematic_elasticsearch_data</text>
  <path d="M710 748H820" class="edge"/>
  <text x="765" y="735" text-anchor="middle" class="label">HTTP :9200</text>
  <path d="M450 355H390V748H450" class="edge dash"/>
  <text x="402" y="650" class="label">HTTP :7080 *</text>

  <text x="40" y="875" class="body">* Set MCP's SCHEMATIC_SERVICE_URL=http://schematic-service:7080 to enable this connection.</text>
  <text x="40" y="901" class="small">Compose currently leaves the schematic URL at its localhost default. Starlark's internal URL is already configured.</text>
  <text x="40" y="928" class="small">Host loopback only: PostgreSQL :5432, schematics :7080, Starlark :7090, Elasticsearch :9200. API :7070 is internal.</text>
  <text x="40" y="952" class="small">Custom images: ghcr.io/wmill/{minecraft-api-nginx, minecraft-mcp, minecraft-api, minecraft-starlark-service, minecraft-schematic-service}:latest</text>
</svg>
