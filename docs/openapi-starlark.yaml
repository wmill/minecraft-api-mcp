openapi: 3.1.0
info:
  title: Minecraft Starlark Build Service
  description: Optional build service on port 7090 that compiles Starlark build scripts into Minecraft structure NBT. Builds run in a resource-limited subprocess; successful builds are cached on disk keyed by content hash (artifact id) and served for placement via the Minecraft mod's NBT placement endpoint.
  version: 0.0.1

servers:
  - url: http://localhost:7090
    description: Local starlark build service

tags:
  - name: system
    description: Health
  - name: build
    description: Compile Starlark source into a cached structure NBT artifact
  - name: artifacts
    description: Built artifact metadata and NBT download
  - name: reference
    description: Script API documentation and example scripts

paths:

  /health:
    get:
      tags: [system]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /build:
    post:
      tags: [build]
      summary: Compile a Starlark script into a structure NBT artifact
      description: Returns 200 for both build success and build failure; a build that ran and produced diagnostics is a successful request. Non-200 codes cover malformed requests (400), a full build queue (429), and internal errors (500).
      operationId: buildStructure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
      responses:
        "200":
          description: Build result — success with artifact metadata, or failure with diagnostics
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/BuildSuccess"
                  - $ref: "#/components/schemas/BuildFailure"
        "400":
          description: Malformed request, invalid root_size, or source exceeds the byte limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Build queue full; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /renders:
    post:
      tags: [artifacts]
      summary: Store an uploaded structure NBT (a captured world region) for rendering
      operationId: uploadRender
      description: >-
        The body is gzipped vanilla structure NBT, normally from the mod's GET /api/world/region/nbt.
        It is validated (gzip, at most 64 MB decompressed, a size whose volume is at most
        STARLARK_MAX_ROOT_VOLUME, a single palette and block list) and stored in the artifact cache
        under rgn_ + sha256(bytes, origin, world)[:16], so the /artifacts/{id}/images routes render it
        (views, cutaways, sections, floors) and an unchanged region reuses its previews. Region
        artifacts count toward the cache byte cap and have no source or install stages.
      parameters:
        - {name: X-Region-Origin, in: header, schema: {type: string, pattern: "^-?\\d+,-?\\d+,-?\\d+$"}, description: World minimum corner, echoed in metadata}
        - {name: X-Region-World, in: header, schema: {type: string}, description: Namespaced world id, echoed in metadata}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Stored (or already cached)
          content:
            application/json:
              schema:
                type: object
                required: [artifact_id, size, cached]
                properties:
                  artifact_id: {type: string, pattern: "^rgn_[0-9a-f]{16}$"}
                  size: {type: array, items: {type: integer}, minItems: 3, maxItems: 3}
                  cached: {type: boolean}
        "400":
          description: Not gzip, not a structure NBT, too many blocks, or malformed headers (detail starts with invalid_nbt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Body larger than STARLARK_MAX_NBT_BYTES
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artifacts/{artifact_id}:
    get:
      tags: [artifacts]
      summary: Get metadata for a built artifact
      operationId: getArtifact
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Artifact metadata (same shape as the build success response)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccess"
        "400":
          description: Invalid artifact id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artifact not found (evicted or never built); rebuilding the same source yields the same id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /artifacts/{artifact_id}/source:
    get:
      summary: The Starlark script an artifact was compiled from
      description: >-
        Evicted with the artifact. MCP placement tools record it with the placed build so the
        mod can show and revise it later.
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: {type: string, pattern: "^(slk|rgn)_[0-9a-f]{16}$"}
      responses:
        "200":
          description: Script source
          content:
            text/plain:
              schema: {type: string}
        "400":
          description: Malformed artifact id
        "404":
          description: Artifact not found (evicted or never built)

  /artifacts/{artifact_id}/nbt:
    get:
      tags: [artifacts]
      summary: Download the gzipped structure NBT for a built artifact
      description: >-
        Without `stage`, the finished structure. With `stage`, one install stage of a staged build
        (see `stages` on the artifact): just the cells that stage writes, at the full structure size.
      operationId: getArtifactNbt
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
        - name: stage
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
          description: Install stage id; 404 when the artifact has no such stage
      responses:
        "200":
          description: Gzipped Minecraft structure NBT
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid artifact id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Artifact not found (evicted or never built)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /docs/catalog:
    get:
      tags: [reference]
      summary: Get focused Starlark documentation or the explicit full catalog
      operationId: getCatalog
      parameters:
        - name: topic
          in: query
          description: quickstart, index (alias of components), math, dsl, composition, errors, a library module, or full
          schema:
            type: string
            default: quickstart
        - name: component
          in: query
          description: Exact component name, such as HipRoof. Takes precedence over topic.
          schema:
            type: string
      responses:
        "200":
          description: Focused documentation as markdown; the complete catalog requires topic=full
          content:
            text/markdown:
              schema:
                type: string
        "400":
          description: Unknown topic or component, with valid names in the error detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Catalog unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /examples:
    get:
      tags: [reference]
      summary: List example Starlark build scripts
      operationId: listExamples
      responses:
        "200":
          description: Example names and one-line summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamplesResponse"
        "503":
          description: Examples unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /examples/{name}:
    get:
      tags: [reference]
      summary: Get the source of one example script
      operationId: getExample
      parameters:
        - name: name
          in: path
          required: true
          description: Example name (lowercase letters, digits, underscores)
          schema:
            type: string
            pattern: "^[a-z0-9_]+$"
      responses:
        "200":
          description: Starlark source text
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid example name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Example not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      description: Artifact id returned by POST /build (slk_) or POST /renders (rgn_), followed by 16 hex chars
      schema:
        type: string
        pattern: "^(slk|rgn)_[0-9a-f]{16}$"

  schemas:
    BuildRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          description: Full Starlark script source; must define the entry function
        entry:
          type: string
          default: build
          description: Entry function name
        props:
          type: object
          description: Keyword arguments passed to the entry function
        root_size:
          type: array
          items:
            type: integer
          minItems: 3
          maxItems: 3
          description: Optional [width, height, length] root bounds; not needed when the root component declares min_size or width/height/length are all in props

    BuildSuccess:
      type: object
      properties:
        ok:
          type: boolean
          const: true
        artifact_id:
          type: string
        cached:
          type: boolean
          description: True when the artifact was served from the cache without rebuilding
        build_ms:
          type: integer
        entry:
          type: string
        props:
          type: object
        created_at:
          type: string
        size:
          type: array
          items:
            type: integer
          description: "[width, height, length] of the structure bounds"
        block_count:
          type: integer
        entity_count:
          type: integer
        ground_level:
          type: integer
        y_offset:
          type: integer
          description: Add to the placement y so the structure's ground level lands at the requested elevation
        nbt_bytes:
          type: integer
        palette:
          type: array
          items:
            type: object
            properties:
              block:
                type: string
              count:
                type: integer
        stages:
          type: array
          description: >-
            Present only when the script uses more than one `stage=` value. Install stages in
            order; place each (GET /artifacts/{id}/nbt?stage=N) stage_delay_ticks apart.
          items:
            type: object
            properties:
              stage:
                type: integer
              block_count:
                type: integer
              nbt_bytes:
                type: integer
        stage_delay_ticks:
          type: integer
          description: Server ticks between install stages (staged builds only; default 2)

    BuildFailure:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error_kind:
          type: string
          enum: [starlark_error, build_error, timeout, resource_limit, crash]
        diagnostics:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
        hint:
          type: string
          description: One-line guidance for fixing and resubmitting

    Diagnostic:
      type: object
      properties:
        code:
          type: string
          description: Stable error code (see the component catalog's error list)
        message:
          type: string
        component_path:
          type: string
        file:
          type: [string, "null"]
        line:
          type: [integer, "null"]
          description: Only Starlark syntax/eval errors carry file:line; build-rule diagnostics identify the component path
        region:
          type: [object, "null"]
        coordinates:
          type: [array, "null"]
          items:
            type: integer
        details:
          type: object

    ExamplesResponse:
      type: object
      properties:
        examples:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              summary:
                type: string
        count:
          type: integer

    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        lib_dir_exists:
          type: boolean
        lib_fingerprint:
          type: string
          description: Hash of the vendored component library; part of the artifact cache key
        cache:
          type: object
          properties:
            artifacts:
              type: integer
            bytes:
              type: integer

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
