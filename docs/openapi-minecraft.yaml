openapi: 3.1.0
info:
  title: Minecraft MCP API
  description: REST API exposed by the Minecraft Fabric mod on port 7070. Wraps world manipulation, build task management, and prefab placement.
  version: 0.0.1

servers:
  - url: http://localhost:7070
    description: Local Minecraft server

tags:
  - name: area-locks
    description: Optional cuboid reservations with idle expiry
  - name: system
    description: Health and connectivity
  - name: players
    description: Player queries and teleportation
  - name: entities
    description: Entity listing and spawning
  - name: blocks
    description: Block read/write, fill, and heightmap
  - name: messages
    description: Broadcast and targeted messages
  - name: prefabs
    description: Prefab structure placement (doors, stairs, windows, etc.)
  - name: structures
    description: NBT structure placement
  - name: effects
    description: World effects
  - name: builds
    description: Build task CRUD, execution, audit, preview, and rail planning

paths:

  /api/area-locks:
    post:
      tags: [area-locks]
      summary: Reserve a cuboid
      operationId: acquireAreaLock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bounds]
              properties:
                bounds:
                  $ref: "#/components/schemas/AreaBounds"
                world:
                  $ref: "#/components/schemas/World"
                label:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/AreaLockGranted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AreaLockConflict"
    get:
      tags: [area-locks]
      summary: List reservations without disclosing tokens
      operationId: listAreaLocks
      description: Filter by world and optionally all six inclusive bounds coordinates. Does not renew reservations.
      parameters:
        - name: world
          in: query
          schema:
            type: string
        - name: min_x
          in: query
          schema:
            type: integer
            format: int32
        - name: min_y
          in: query
          schema:
            type: integer
            format: int32
        - name: min_z
          in: query
          schema:
            type: integer
            format: int32
        - name: max_x
          in: query
          schema:
            type: integer
            format: int32
        - name: max_y
          in: query
          schema:
            type: integer
            format: int32
        - name: max_z
          in: query
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Active reservations
          content:
            application/json:
              schema:
                type: object
                properties:
                  locks:
                    type: array
                    items:
                      $ref: "#/components/schemas/AreaLockMetadata"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/area-locks/{lock_id}:
    parameters:
      - $ref: "#/components/parameters/AreaLockPathId"
    patch:
      tags: [area-locks]
      summary: Renew or resize a reservation
      operationId: updateAreaLock
      description: An empty object renews. Replacement bounds resize atomically; a failed resize preserves the old bounds and expiry. The world cannot change.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bounds:
                  $ref: "#/components/schemas/AreaBounds"
      responses:
        "200":
          $ref: "#/components/responses/AreaLockGranted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/AreaLockConflict"
    delete:
      tags: [area-locks]
      summary: Release a reservation (idempotent)
      operationId: releaseAreaLock
      responses:
        "200":
          description: Reservation released or already absent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean


  # ── System ──────────────────────────────────────────────────────────────────

  /api/test:
    get:
      tags: [system]
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Server is running
          content:
            text/plain:
              schema:
                type: string
                example: Server is running

  # ── Players ─────────────────────────────────────────────────────────────────

  /api/world/players:
    get:
      tags: [players]
      summary: List online players
      operationId: getPlayers
      responses:
        "200":
          description: Array of online players with positions and rotations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerInfo"

  /api/players/teleport:
    post:
      tags: [players]
      summary: Teleport a player
      operationId: teleportPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeleportRequest"
      responses:
        "200":
          description: Teleport successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeleportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Player not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Entities ─────────────────────────────────────────────────────────────────

  /api/world/entities:
    get:
      tags: [entities]
      summary: List available entity types
      operationId: getEntities
      responses:
        "200":
          description: Array of entity types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntityInfo"

  /api/world/entities/spawn:
    post:
      tags: [entities]
      summary: Spawn an entity
      operationId: spawnEntity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EntitySpawnRequest"
      responses:
        "200":
          description: Entity spawned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntitySpawnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Blocks ───────────────────────────────────────────────────────────────────

  /api/world/blocks/list:
    get:
      tags: [blocks]
      summary: List available block types
      operationId: listBlocks
      responses:
        "200":
          description: Array of block types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockInfo"

  /api/world/blocks/set:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [blocks]
      summary: Set a 3-D array of blocks
      operationId: setBlocks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockSetRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Blocks placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockSetResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/blocks/chunk:
    post:
      tags: [blocks]
      summary: Read a 3-D chunk of blocks
      operationId: getBlocksChunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkRequest"
      responses:
        "200":
          description: Block chunk data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChunkResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/blocks/fill:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [blocks]
      summary: Fill a rectangular region with a single block type
      operationId: fillBox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FillBoxRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Fill completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FillResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/blocks/survey:
    post:
      tags: [blocks]
      summary: Survey ground and known occupancy in a chosen footprint
      operationId: surveySite
      description: >-
        Read-only; inclusive corners (normalized if reversed), maximum 10000 columns.
        Requires already-loaded full chunks and a dimension without a ceiling.
        Scans at most 64 blocks downward beneath vegetation. The suggested walking
        plane is the lower median of dry ground, suppressed for unresolved ground,
        lava, or no dry ground. Cut/fill excludes clearing, drainage and cavities.
        Overlaps cover full world height; observations do not reserve land or prove it is unused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSurveyRequest"
      responses:
        "200":
          description: Compact ground assessment and capped occupancy summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSurveyResponse"
        "400":
          description: Invalid footprint/world, ceiling dimension, or unloaded chunks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSurveyError"
        "504":
          description: Timed out waiting for server-thread sampling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSurveyError"

  /api/world/blocks/heightmap:
    post:
      tags: [blocks]
      summary: Get heightmap for a region
      operationId: getHeightmap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeightmapRequest"
      responses:
        "200":
          description: Heightmap data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeightmapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/blocks/heightmap/preview:
    post:
      tags: [blocks]
      summary: Render isometric heightmap preview as PNG
      operationId: previewHeightmap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeightmapPreviewRequest"
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "204":
          description: No blocks in region
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Messages ─────────────────────────────────────────────────────────────────

  /api/message/broadcast:
    post:
      tags: [messages]
      summary: Broadcast a message to all players
      operationId: broadcastMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/message/player:
    post:
      tags: [messages]
      summary: Send a message to a specific player
      operationId: sendMessageToPlayer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerMessageRequest"
      responses:
        "200":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerMessageResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Prefabs ──────────────────────────────────────────────────────────────────

  /api/world/prefabs/door:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Place one or more doors
      operationId: placeDoor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoorRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Doors placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoorResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/prefabs/stairs:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Build a staircase
      operationId: placeStairs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StairsRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Staircase placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StairsResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/prefabs/window-pane:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Place a wall of window panes
      operationId: placeWindowPane
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WindowPaneRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Window panes placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WindowPaneResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/prefabs/torch:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Place a torch
      operationId: placeTorch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TorchRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Torch placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TorchResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/prefabs/sign:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Place a sign with text
      operationId: placeSign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Sign placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/world/prefabs/ladder:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [prefabs]
      summary: Place a vertical ladder
      operationId: placeLadder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LadderRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Ladder placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LadderResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Structures ───────────────────────────────────────────────────────────────

  /api/world/structure/place:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [structures]
      summary: Place an NBT structure (multipart upload)
      description: |
        Places the structure and records it as a build. The cuboid is snapshotted immediately
        before placement (inside the lock check) so `POST /api/builds/{id}/undo` can restore it.
        With `dry_run=true` nothing is written: the response is an `NbtStructureDryRunResponse`
        describing what would be overwritten. A dry run never loads chunks (400 `unloaded_chunks`)
        and never renews the area lock.
      operationId: placeNbtStructure
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/NbtStructurePlaceRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Structure placed
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/NbtStructurePlaceResponse"
                  - $ref: "#/components/schemas/NbtStructureDryRunResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Effects ──────────────────────────────────────────────────────────────────

  /api/world/effects/rain-fire:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [effects]
      summary: Rain fire over a circular area
      operationId: rainFire
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RainFireRequest"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "200":
          description: Fire placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RainFireResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  # ── Builds ───────────────────────────────────────────────────────────────────

  /api/builds:
    post:
      tags: [builds]
      summary: Create a new build
      operationId: createBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuildRequest"
      responses:
        "201":
          description: Build created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/query-location:
    post:
      tags: [builds]
      summary: Find builds overlapping a bounding box
      operationId: queryBuildsByLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationQueryRequest"
      responses:
        "200":
          description: Matching builds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}:
    get:
      tags: [builds]
      summary: Get build with all tasks
      operationId: getBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Build details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/tasks:
    get:
      tags: [builds]
      summary: List tasks for a build
      operationId: getBuildTasks
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/ServerError"

    post:
      tags: [builds]
      summary: Add a task to a build
      operationId: addBuildTask
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTaskRequest"
      responses:
        "201":
          description: Task added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

    put:
      tags: [builds]
      summary: Reorder all tasks for a build
      operationId: reorderBuildTasks
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderTasksRequest"
      responses:
        "200":
          description: Tasks reordered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReorderTasksResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/tasks/{taskId}:
    delete:
      tags: [builds]
      summary: Delete a task from a build
      operationId: deleteBuildTask
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

    patch:
      tags: [builds]
      summary: Update a task's data or description
      operationId: updateBuildTask
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/execute:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [builds]
      summary: Start executing a build asynchronously
      operationId: executeBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "409":
          $ref: "#/components/responses/AreaLockConflict"
        "202":
          description: Execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/replay:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [builds]
      summary: Reset and re-execute all tasks for a build
      description: NBT placements are rejected without changing status; use redo after undo instead.
      operationId: replayBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "409":
          description: NBT placement, executing build, reverted build, or area-lock conflict
        "202":
          description: Replay started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncAcceptedResponse"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [builds]
      summary: Undo an NBT placement from its saved snapshot
      description: |
        Restore blocks, air and block entities, saving the current region for redo.
        Entities are unchanged. On success the same build becomes REVERTED and redo is
        available. Later unreverted builds overlapping the cuboid block the undo
        (409 `undo_conflict`) unless `force` is true. Force never bypasses area locks.
      operationId: undoBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildUndoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Build not found
        "409":
          description: Already reverted, unresolved restore, `undo_conflict` with overlapping later builds, or an area-lock conflict
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Snapshots are not configured
        "504":
          description: Timed out waiting for the server thread; inspect the world before retrying

  /api/builds/{id}/redo:
    parameters:
      - $ref: "#/components/parameters/AreaLockHeader"
    post:
      tags: [builds]
      summary: Restore the region saved immediately before undo
      description: |
        Requires a REVERTED NBT placement with a redo snapshot. Restores the exact
        pre-undo region, including edits made before undo, and saves the current
        region for another undo. The same build becomes COMPLETED. Entities are
        unchanged. Force allows later build overlaps but never bypasses area locks.
      operationId: redoBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Snapshot restored; undo is available again
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildRedoResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Build not found
        "409":
          description: Not reverted, unresolved restore, `redo_conflict` with overlapping later builds, or an area-lock conflict
        "500":
          $ref: "#/components/responses/ServerError"
        "503":
          description: Snapshots are not configured
        "504":
          description: Timed out waiting for the server thread; inspect build status and the world before retrying

  /api/builds/{id}/preview:
    get:
      tags: [builds]
      summary: Render isometric build preview as PNG
      operationId: previewBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
        - name: iso_scale
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 32
            default: 6
        - name: terrain_margin
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 8
            default: 0
        - name: view_direction
          in: query
          schema:
            $ref: "#/components/schemas/ViewDirection"
      responses:
        "200":
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        "204":
          description: No blocks to render
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/audit:
    post:
      tags: [builds]
      summary: Audit a build for issues
      operationId: auditBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Audit results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/builds/{id}/plan-rail:
    post:
      tags: [builds]
      summary: Start async rail route planning
      operationId: planRail
      parameters:
        - $ref: "#/components/parameters/BuildId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRailPlanningRequest"
      responses:
        "202":
          description: Planning job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RailPlanningJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/ServerError"

  /api/rail-plans/{jobId}:
    get:
      tags: [builds]
      summary: Poll rail planning job status
      operationId: getRailPlanStatus
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Planning job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RailPlanningJobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/ServerError"

# ── Components ───────────────────────────────────────────────────────────────

components:

  parameters:
    AreaLockHeader:
      name: X-Area-Lock-Id
      in: header
      required: false
      description: Optional reservation token. Writes must fit inside its world and cuboid. Unknown or expired tokens fail; absence only permits writes outside reserved areas. Execute/replay carries the token into each task and stops on a lock failure.
      schema:
        type: string
    AreaLockPathId:
      name: lock_id
      in: path
      required: true
      schema:
        type: string
    BuildId:
      name: id
      in: path
      required: true
      description: Build UUID
      schema:
        type: string
        format: uuid

    TaskId:
      name: taskId
      in: path
      required: true
      description: Task UUID
      schema:
        type: string
        format: uuid

  responses:
    AreaLockGranted:
      description: Reservation including its usable token and idle expiry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AreaLock"
    AreaLockConflict:
      description: Conflicting reservation, write outside its reservation, or unknown/expired token. No blocks are written by the rejected operation. Queued task failures are reported in build status instead.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AreaLockError"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Operation not allowed in current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    SiteSurveyRequest:
      type: object
      required: [x1, z1, x2, z2]
      properties:
        x1: {type: integer, format: int32}
        z1: {type: integer, format: int32}
        x2: {type: integer, format: int32}
        z2: {type: integer, format: int32}
        world: {type: string, default: "minecraft:overworld"}

    SiteSurveyError:
      type: object
      required: [success, code, error]
      properties:
        success: {const: false}
        code: {type: string, enum: [invalid_request, ceiling_dimension, unloaded_chunks, survey_timeout]}
        error: {type: string}
        missing_chunks:
          type: array
          items:
            type: object
            required: [x, z]
            properties:
              x: {type: integer}
              z: {type: integer}

    SurveyCoverage:
      type: object
      required: [columns, fraction]
      properties:
        columns: {type: integer, minimum: 0}
        fraction: {type: number, minimum: 0, maximum: 1}

    SurveyOverlaps:
      type: object
      required: [status, total, truncated, entries]
      properties:
        status: {type: string, enum: [available, unavailable]}
        total: {type: [integer, "null"], description: "Null means lookup unavailable, not zero overlaps"}
        truncated: {type: boolean}
        entries:
          type: array
          maxItems: 5
          items: {type: object}

    SiteSurveyResponse:
      type: object
      required: [success, world, surveyed_at, bounds, size, ground, slope, water, lava, vegetation, grading, reservations, builds, limitations]
      properties:
        success: {const: true}
        world: {type: string}
        surveyed_at: {type: string, format: date-time}
        bounds:
          type: object
          required: [min_x, min_z, max_x, max_z]
          properties:
            min_x: {type: integer}
            min_z: {type: integer}
            max_x: {type: integer}
            max_z: {type: integer}
        size:
          type: object
          required: [x, z, columns]
          properties:
            x: {type: integer}
            z: {type: integer}
            columns: {type: integer}
        ground:
          type: object
          required: [resolved_columns, unresolved_columns, unresolved_reasons, min_y, max_y, median_y, range]
          properties:
            resolved_columns: {type: integer}
            unresolved_columns: {type: integer}
            unresolved_reasons:
              type: object
              additionalProperties: {type: integer}
              description: Counts of unsupported_surface, void, and scan_limit
            min_y: {type: [integer, "null"]}
            max_y: {type: [integer, "null"]}
            median_y: {type: [integer, "null"], description: Lower median of resolved walking-plane Y values}
            range: {type: [integer, "null"]}
        slope:
          type: object
          required: [adjacent_pairs, mean_step, max_step]
          description: Absolute height differences per horizontal block across resolved orthogonal neighbors
          properties:
            adjacent_pairs: {type: integer}
            mean_step: {type: number}
            max_step: {type: integer}
        water: {$ref: "#/components/schemas/SurveyCoverage"}
        lava: {$ref: "#/components/schemas/SurveyCoverage"}
        vegetation: {$ref: "#/components/schemas/SurveyCoverage"}
        grading:
          type: object
          required: [suggested_walking_y, cut_blocks, fill_blocks, unavailable_reason]
          properties:
            suggested_walking_y: {type: [integer, "null"]}
            cut_blocks: {type: [integer, "null"]}
            fill_blocks: {type: [integer, "null"]}
            unavailable_reason: {type: [string, "null"], enum: [unresolved_ground, lava_present, no_dry_ground, null]}
        reservations:
          allOf:
            - $ref: "#/components/schemas/SurveyOverlaps"
            - type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [label, bounds, expires_at]
                    properties:
                      label: {type: string, maxLength: 80}
                      bounds: {$ref: "#/components/schemas/AreaBounds"}
                      expires_at: {type: string, format: date-time}
        builds:
          allOf:
            - $ref: "#/components/schemas/SurveyOverlaps"
            - type: object
              properties:
                entries:
                  type: array
                  items:
                    type: object
                    required: [build_id, name, status]
                    properties:
                      build_id: {type: string, format: uuid}
                      name: {type: string, maxLength: 80}
                      status: {type: string}
        limitations: {type: string}

    AreaBounds:
      type: object
      description: Inclusive block bounds; each minimum must not exceed its maximum.
      required: [min_x, min_y, min_z, max_x, max_y, max_z]
      properties:
        min_x:
          type: integer
          format: int32
        min_y:
          type: integer
          format: int32
        min_z:
          type: integer
          format: int32
        max_x:
          type: integer
          format: int32
        max_y:
          type: integer
          format: int32
        max_z:
          type: integer
          format: int32
    AreaLockMetadata:
      type: object
      required: [world, bounds, label, expires_at, idle_timeout_seconds]
      properties:
        world:
          type: string
        bounds:
          $ref: "#/components/schemas/AreaBounds"
        label:
          type: string
        expires_at:
          type: string
          format: date-time
        idle_timeout_seconds:
          type: integer
          default: 900
    AreaLock:
      allOf:
        - $ref: "#/components/schemas/AreaLockMetadata"
        - type: object
          required: [lock_id]
          properties:
            lock_id:
              type: string
              format: uuid
    AreaLockError:
      type: object
      required: [success, code, error]
      properties:
        success:
          type: boolean
          const: false
        code:
          type: string
          enum: [area_locked, outside_area_lock, invalid_area_lock]
        error:
          type: string
        reservation:
          $ref: "#/components/schemas/AreaLockMetadata"
        requested_world:
          type: string
        requested_bounds:
          type: object
          description: Inclusive operation bounds; empty for a no-op with a mismatched world.

    # ── Shared primitives ──────────────────────────────────────────────────────

    ErrorResponse:
      type: object
      properties:
        error:
          type: string

    World:
      type: string
      default: minecraft:overworld
      example: minecraft:overworld

    Position3D:
      type: object
      properties:
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required: [x, y, z]

    BlockData:
      type: object
      properties:
        block_name:
          type: string
          example: minecraft:stone
        block_states:
          type: object
          additionalProperties:
            type: string
          example:
            facing: north
      required: [block_name]

    BuildStatus:
      type: string
      enum: [CREATED, IN_PROGRESS, COMPLETED, FAILED, REVERTED]

    TaskStatus:
      type: string
      enum: [QUEUED, EXECUTING, COMPLETED, FAILED]

    TaskType:
      type: string
      enum:
        - BLOCK_SET
        - BLOCK_FILL
        - PREFAB_DOOR
        - PREFAB_STAIRS
        - PREFAB_WINDOW
        - PREFAB_TORCH
        - PREFAB_SIGN
        - PREFAB_LADDER
        - RAIL_SURFACE_SEGMENT
        - RAIL_BRIDGE_SEGMENT
        - RAIL_TUNNEL_SEGMENT

    HeightmapType:
      type: string
      enum: [WORLD_SURFACE, MOTION_BLOCKING, MOTION_BLOCKING_NO_LEAVES, OCEAN_FLOOR]
      default: WORLD_SURFACE

    BlockRotation:
      type: string
      enum: [NONE, CLOCKWISE_90, CLOCKWISE_180, COUNTERCLOCKWISE_90]
      default: NONE

    ViewDirection:
      type: string
      enum: [south, west, north, east]
      default: south

    Build:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        world:
          $ref: "#/components/schemas/World"
        status:
          $ref: "#/components/schemas/BuildStatus"
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      required: [id, name, world, status, created_at]

    BuildTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        build_id:
          type: string
          format: uuid
        task_order:
          type: integer
        task_type:
          $ref: "#/components/schemas/TaskType"
        status:
          $ref: "#/components/schemas/TaskStatus"
        task_data:
          type: object
          description: Task-specific JSON payload
        description:
          type: string
        executed_at:
          type: string
          format: date-time
        lock_error:
          $ref: "#/components/schemas/AreaLockError"
        error_message:
          type: string
      required: [id, build_id, task_order, task_type, status, task_data]

    # ── Players ───────────────────────────────────────────────────────────────

    PlayerInfo:
      type: object
      properties:
        name:
          type: string
        uuid:
          type: string
          format: uuid
        position:
          $ref: "#/components/schemas/Position3D"
        rotation:
          type: object
          properties:
            yaw:
              type: number
            pitch:
              type: number
          required: [yaw, pitch]
      required: [name, uuid, position, rotation]

    TeleportRequest:
      type: object
      properties:
        player_name:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
        dimension:
          $ref: "#/components/schemas/World"
        yaw:
          type: number
          default: 0.0
        pitch:
          type: number
          default: 0.0
      required: [player_name, x, y, z]

    TeleportResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        status:
          type: string
          example: success
        message:
          type: string
        player_name:
          type: string
        x:
          type: number
        y:
          type: number
        z:
          type: number
        dimension:
          type: string
        yaw:
          type: number
        pitch:
          type: number

    # ── Entities ──────────────────────────────────────────────────────────────

    EntityInfo:
      type: object
      properties:
        id:
          type: string
          example: minecraft:zombie
        display_name:
          type: string
      required: [id, display_name]

    EntitySpawnRequest:
      type: object
      properties:
        type:
          type: string
          example: minecraft:zombie
        world:
          $ref: "#/components/schemas/World"
        x:
          type: number
        y:
          type: number
        z:
          type: number
      required: [type, x, y, z]

    EntitySpawnResponse:
      type: object
      properties:
        success:
          type: boolean
        type:
          type: string
        uuid:
          type: string
          format: uuid
        position:
          $ref: "#/components/schemas/Position3D"

    # ── Blocks ────────────────────────────────────────────────────────────────

    BlockInfo:
      type: object
      properties:
        id:
          type: string
          example: minecraft:stone
        display_name:
          type: string
      required: [id, display_name]

    BlockSetRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        blocks:
          type: array
          description: 3-D array [x][y][z]; null entries are skipped
          items:
            type: array
            items:
              type: array
              items:
                oneOf:
                  - $ref: "#/components/schemas/BlockData"
                  - type: "null"
      required: [start_x, start_y, start_z, blocks]

    BlockSetResponse:
      type: object
      properties:
        success:
          type: boolean
        blocks_set:
          type: integer
        blocks_skipped:
          type: integer
        world:
          type: string

    ChunkRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        size_x:
          type: integer
        size_y:
          type: integer
        size_z:
          type: integer
      required: [start_x, start_y, start_z, size_x, size_y, size_z]

    ChunkResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        start_position:
          $ref: "#/components/schemas/Position3D"
        size:
          $ref: "#/components/schemas/Position3D"
        blocks:
          type: array
          description: 3-D array [x][y][z]
          items:
            type: array
            items:
              type: array
              items:
                $ref: "#/components/schemas/BlockData"

    FillBoxRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x1:
          type: integer
        y1:
          type: integer
        z1:
          type: integer
        x2:
          type: integer
        y2:
          type: integer
        z2:
          type: integer
        block_type:
          type: string
          example: minecraft:stone
        notify_neighbors:
          type: boolean
          default: false
      required: [x1, y1, z1, x2, y2, z2, block_type]

    FillResponse:
      type: object
      properties:
        success:
          type: boolean
        blocks_set:
          type: integer
        blocks_failed:
          type: integer
        total_blocks:
          type: integer
        world:
          type: string
        box_bounds:
          type: object

    HeightmapRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x1:
          type: integer
        z1:
          type: integer
        x2:
          type: integer
        z2:
          type: integer
        heightmap_type:
          $ref: "#/components/schemas/HeightmapType"
      required: [x1, z1, x2, z2]

    HeightmapResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        area_bounds:
          type: object
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        heightmap_type:
          type: string
        height_range:
          type: object
          properties:
            min:
              type: integer
            max:
              type: integer
        heights:
          type: array
          description: >-
            heights[x_offset][z_offset] relative to minimum X/Z, with inclusive bounds.
            Each value is first-air Y above the surface selected by heightmap_type,
            not necessarily safe walking ground (e.g. treetops or water).
          items:
            type: array
            items:
              type: integer

    HeightmapPreviewRequest:
      allOf:
        - $ref: "#/components/schemas/HeightmapRequest"
        - type: object
          properties:
            iso_scale:
              type: integer
              minimum: 1
              maximum: 32
              default: 6
            view_direction:
              $ref: "#/components/schemas/ViewDirection"

    # ── Messages ──────────────────────────────────────────────────────────────

    BroadcastRequest:
      type: object
      properties:
        message:
          type: string
        action_bar:
          type: boolean
      required: [message, action_bar]

    BroadcastResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        player_count:
          type: integer

    PlayerMessageRequest:
      type: object
      properties:
        message:
          type: string
        uuid:
          type: string
          format: uuid
        name:
          type: string
        action_bar:
          type: boolean
      required: [message, action_bar]

    PlayerMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    # ── Prefabs ───────────────────────────────────────────────────────────────

    DoorRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        width:
          type: integer
          default: 1
        facing:
          type: string
          example: north
        block_type:
          type: string
          example: minecraft:oak_door
        hinge:
          type: string
          enum: [left, right]
          default: left
        open:
          type: boolean
          default: false
        double_doors:
          type: boolean
          default: false
      required: [start_x, start_y, start_z, facing, block_type]

    DoorResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        doors_placed:
          type: integer
        facing:
          type: string
        hinge:
          type: string
        open:
          type: boolean

    StairsRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        end_x:
          type: integer
        end_y:
          type: integer
        end_z:
          type: integer
        block_type:
          type: string
          example: minecraft:oak_stairs
        stair_type:
          type: string
        staircase_direction:
          type: string
        fill_support:
          type: boolean
          default: false
      required: [start_x, start_y, start_z, end_x, end_y, end_z, block_type, stair_type, staircase_direction]

    StairsResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        blocks_placed:
          type: integer
        staircase_direction:
          type: string
        fill_support:
          type: boolean

    WindowPaneRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        end_x:
          type: integer
        end_z:
          type: integer
        height:
          type: integer
        block_type:
          type: string
          example: minecraft:glass_pane
        waterlogged:
          type: boolean
          default: false
      required: [start_x, start_y, start_z, end_x, end_z, height, block_type]

    WindowPaneResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        panes_placed:
          type: integer
        orientation:
          type: string
        waterlogged:
          type: boolean

    TorchRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x:
          type: integer
        y:
          type: integer
        z:
          type: integer
        block_type:
          type: string
          example: minecraft:torch
        facing:
          type: string
          description: Required for wall torches (north/south/east/west)
      required: [x, y, z, block_type]

    TorchResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        position:
          $ref: "#/components/schemas/Position3D"
        block_type:
          type: string
        wall_mounted:
          type: boolean
        facing:
          type: string

    SignRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x:
          type: integer
        y:
          type: integer
        z:
          type: integer
        block_type:
          type: string
          example: minecraft:oak_sign
        front_lines:
          type: array
          maxItems: 4
          items:
            type: string
        back_lines:
          type: array
          maxItems: 4
          items:
            type: string
        facing:
          type: string
          description: For wall signs
        rotation:
          type: integer
          minimum: 0
          maximum: 15
          description: For standing signs
        glowing:
          type: boolean
          default: false
      required: [x, y, z, block_type]

    SignResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        position:
          $ref: "#/components/schemas/Position3D"
        block_type:
          type: string
        sign_type:
          type: string
          enum: [wall, standing]
        glowing:
          type: boolean
        facing:
          type: string
        rotation:
          type: integer

    LadderRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x:
          type: integer
        y:
          type: integer
        z:
          type: integer
        height:
          type: integer
        block_type:
          type: string
          example: minecraft:ladder
        facing:
          type: string
      required: [x, y, z, height, block_type]

    LadderResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        blocks_placed:
          type: integer
        facing:
          type: string
        start_position:
          $ref: "#/components/schemas/Position3D"
        end_position:
          $ref: "#/components/schemas/Position3D"

    # ── Structures ────────────────────────────────────────────────────────────

    NbtStructurePlaceRequest:
      type: object
      properties:
        nbt_file:
          type: string
          format: binary
          description: NBT structure file
        world:
          type: string
          default: minecraft:overworld
        x:
          type: integer
          default: 0
        y:
          type: integer
          default: 64
        z:
          type: integer
          default: 0
        rotation:
          $ref: "#/components/schemas/BlockRotation"
        include_entities:
          type: string
          enum: ["true", "false"]
          default: "true"
        replace_blocks:
          type: string
          enum: ["true", "false"]
          default: "true"
        dry_run:
          type: string
          enum: ["true", "false"]
          default: "false"
          description: Report what would be overwritten without changing the world
      required: [nbt_file]

    NbtStructurePlaceResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        filename:
          type: string
        position:
          $ref: "#/components/schemas/Position3D"
        world:
          type: string
        structure_size:
          $ref: "#/components/schemas/Position3D"
        rotation:
          type: string
        include_entities:
          type: boolean
        replace_blocks:
          type: boolean
        build_id:
          type: string
          format: uuid
          description: Recorded build; absent when the build database is unavailable
        undo_available:
          type: boolean
          description: True once the pre-placement snapshot has been written
        undo_unavailable_reason:
          type: string
          enum: [snapshots_disabled, snapshot_too_large, snapshot_unavailable, build_not_recorded, snapshot_write_failed]

    NbtStructureDryRunResponse:
      type: object
      properties:
        success:
          type: boolean
        dry_run:
          type: boolean
          enum: [true]
        world:
          type: string
        position:
          $ref: "#/components/schemas/Position3D"
        rotation:
          type: string
        structure_size:
          $ref: "#/components/schemas/Position3D"
        bounds:
          $ref: "#/components/schemas/AreaBounds"
        overwrite:
          type: object
          description: Template blocks compared by block id (states ignored) with the world
          properties:
            template_blocks: {type: integer}
            replaced: {type: integer, description: Existing non-air blocks that would change}
            unchanged: {type: integer}
            air_carved: {type: integer, description: Replaced blocks whose template cell is air}
            placed_into_air: {type: integer}
            replaced_by_category:
              type: object
              properties:
                terrain: {type: integer}
                logs_leaves: {type: integer}
                vegetation: {type: integer}
                fluids: {type: integer}
                block_entities: {type: integer}
                other: {type: integer}
            top_replaced:
              type: array
              maxItems: 10
              items:
                type: object
                properties:
                  block: {type: string}
                  count: {type: integer}
        lock_check:
          type: object
          description: "`{ok: true}` or the area-lock error a real placement would get, with `ok: false`"
        reservations:
          type: object
          description: Overlapping reservations (same shape as the site survey)
        builds:
          type: object
          description: Overlapping unreverted recorded builds (same shape as the site survey)
        undo_snapshot:
          type: boolean
          description: Whether a real placement would be small enough to snapshot for undo

    BuildRestoreResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [REVERTED, COMPLETED]
        world:
          type: string
        bounds:
          $ref: "#/components/schemas/AreaBounds"
        overwrote_later_builds:
          type: integer
        undo_available:
          type: boolean
        redo_available:
          type: boolean
        message:
          type: string

    BuildUndoResponse:
      allOf:
        - $ref: "#/components/schemas/BuildRestoreResponse"
        - type: object
          properties:
            status:
              enum: [REVERTED]

    BuildRedoResponse:
      allOf:
        - $ref: "#/components/schemas/BuildRestoreResponse"
        - type: object
          properties:
            status:
              enum: [COMPLETED]

    # ── Effects ───────────────────────────────────────────────────────────────

    RainFireRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        x:
          type: integer
          description: Center X
        z:
          type: integer
          description: Center Z
        radius:
          type: integer
          minimum: 1
          maximum: 56
        density:
          type: number
          format: float
          minimum: 0.0
          maximum: 1.0
        seed:
          type: integer
          format: int64
      required: [x, z, radius, density]

    RainFireResponse:
      type: object
      properties:
        success:
          type: boolean
        world:
          type: string
        fires_placed:
          type: integer
        columns_considered:
          type: integer
        center:
          type: object
          properties:
            x:
              type: integer
            z:
              type: integer
        radius:
          type: integer
        density:
          type: number

    # ── Builds ────────────────────────────────────────────────────────────────

    CreateBuildRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        world:
          $ref: "#/components/schemas/World"
      required: [name]

    BuildResponse:
      type: object
      properties:
        success:
          type: boolean
        build:
          $ref: "#/components/schemas/Build"

    BuildDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        build:
          $ref: "#/components/schemas/Build"
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BuildTask"

    TaskResponse:
      type: object
      properties:
        success:
          type: boolean
        task:
          $ref: "#/components/schemas/BuildTask"

    TaskListResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        task_count:
          type: integer
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BuildTask"

    AddTaskRequest:
      type: object
      properties:
        task_type:
          $ref: "#/components/schemas/TaskType"
        task_data:
          type: object
          description: Task-specific JSON payload
        description:
          type: string
        task_order:
          type: integer
          description: Insert at this position; appended if omitted
      required: [task_type, task_data]

    ReorderTasksRequest:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/BuildTask"
      required: [tasks]

    ReorderTasksResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        task_count:
          type: integer
        message:
          type: string

    DeleteTaskResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        deleted_task_id:
          type: string
          format: uuid
        message:
          type: string

    UpdateTaskRequest:
      type: object
      properties:
        task_data:
          type: object
        description:
          type: string

    AsyncAcceptedResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        message:
          type: string
        status:
          type: string
          example: accepted

    AuditResponse:
      type: object
      properties:
        success:
          type: boolean
        build_id:
          type: string
          format: uuid
        issues:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [warning, error]
              task_id:
                type: string
                format: uuid
              task_order:
                type: integer
              check:
                type: string
              message:
                type: string
        summary:
          type: object
          properties:
            warnings:
              type: integer
            errors:
              type: integer

    LocationQueryRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        min_x:
          type: integer
        min_y:
          type: integer
        min_z:
          type: integer
        max_x:
          type: integer
        max_y:
          type: integer
        max_z:
          type: integer
        include_in_progress:
          type: boolean
          default: false
      required: [min_x, min_y, min_z, max_x, max_y, max_z]

    LocationQueryResponse:
      type: object
      properties:
        success:
          type: boolean
        query_area:
          type: object
          properties:
            min_x:
              type: integer
            min_y:
              type: integer
            min_z:
              type: integer
            max_x:
              type: integer
            max_y:
              type: integer
            max_z:
              type: integer
            world:
              type: string
        build_count:
          type: integer
        total_task_count:
          type: integer
        builds:
          type: array
          items:
            type: object

    StartRailPlanningRequest:
      type: object
      properties:
        world:
          $ref: "#/components/schemas/World"
        start_x:
          type: integer
        start_y:
          type: integer
        start_z:
          type: integer
        end_x:
          type: integer
        end_y:
          type: integer
        end_z:
          type: integer
        weight_overrides:
          type: object
          additionalProperties:
            type: number
        rail_bed_block:
          type: string
          default: minecraft:stone
        support_block:
          type: string
          default: minecraft:stone_bricks
        power_block:
          type: string
          default: minecraft:redstone_block
        tunnel_lining_block:
          type: string
          default: minecraft:stone_bricks
      required: [start_x, start_y, start_z, end_x, end_y, end_z]

    RailPlanningJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        build_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PLANNING, COMPLETED, FAILED]
        phase:
          type: string
        sampled_area_count:
          type: integer
        route_length:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        error_message:
          type: string
        result:
          type: object

    RailPlanningJobResponse:
      type: object
      properties:
        success:
          type: boolean
        planning_job:
          $ref: "#/components/schemas/RailPlanningJob"
